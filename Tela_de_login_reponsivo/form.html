<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="form.css">
    <title>Login</title>
</head>
<body>
    <div id="mae">

        <div id="dados">
            <h1>Login</h1>
            <input type="email" name="email" id="email" placeholder="Email">
            <input type="password" name="senha" id="senha" placeholder="password">
            <p><a href="#">Esquenci a senha</a></p>
            <input type="submit" value="Entrar" id="btn_send">
        </div>

        <div id="bemvindo">
           <div id="cont">
            <h1>Bem-Vindo</h1>
            <p>Faça o seu cadastro na nossa plantaforma</p>
            <p>O Teus dados nunca estiveram então protegido</p>
            <p>Cadastra-se Já</p>
            <button class="btn" id="btn_registrar">Registrar</button>
           </div>
        </div>
    </div>
</body>
</html>
