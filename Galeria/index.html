<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>move list</title>
    <style>
        body{
            display: flex;
            align-items: center;
            height: 100vh;
            justify-content: center;
            margin: 0;
            background-color: rgb(129, 235, 235);
        }
        #mae{
            width: 600px;
        }
        .container{
            width: 100%;
            height: 350px;
            display: flex;
            gap: 1px;
            gap: 2px;
            box-shadow: 4px 4px 10px rgba(32, 32, 32, 0.281);
            border-radius: 10px;
            padding: 6px;
            align-items: center;
            overflow: hidden;
            justify-content: center;
        }
        
        .container img {
            width: 100px;
            height: 100%;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid white;
            object-fit: cover;
            transition: all ease-in-out 0.6s;
        }
        
        .container img:hover{
             width: 30%;
        }
    </style>
</head>
<body>
    <div id="mae">
        <div class="container">
            <img src="img1.jpg">
            <img src="img2.jpg">
            <img src="img3.jpg">
            <img src="img4.jpg">
            <img src="img5.jpg">
        </div>
    </div>
</body>
</html>
